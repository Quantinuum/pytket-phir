[build-system]
requires = ["setuptools>=77", "setuptools_scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

# https://packaging.python.org/en/latest/specifications/declaring-project-metadata/
[project]
name = "pytket-phir"
description = "A circuit analyzer and translator from pytket to PHIR"
readme = "README.md"
requires-python = ">=3.12, <3.16"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Quantinuum" }]
maintainers = [
  { name = "Kartik Singhal", email = "Kartik.Singhal@quantinuum.com" },
]

classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dynamic = ["version"]
dependencies = [
  "phir>=0.3.3",
  "pytket>=2.16.0",
  "wasmtime>=43.0.0",
]

[dependency-groups]
dev = [
  "networkx<3",
  "prek>=0.3.11",
  "pydata-sphinx-theme>=0.16.1",
  "pytest==9.1.1",
  "rich>=13.0",
  "sphinx>8.1",
  "ty>=0.0.33",
]

[tool.uv]
required-version = ">=0.13.4"
required-environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]
exclude-newer = "7 days"
exclude-newer-package = { certifi = false }

[project.scripts]
phirc = "pytket.phir.cli:main"

[project.urls]
Changelog = "https://github.com/quantinuum/pytket-phir/blob/main/CHANGELOG.md"
Documentation = "https://quantinuum.github.io/pytket-phir/"
Repository = "https://github.com/quantinuum/pytket-phir.git"

[project.optional-dependencies]
phirc = ["quantum-pecos>=0.8.0.dev0"]

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"pytket.phir" = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-s -vv"
pythonpath = ["."]
log_cli = true
log_cli_level = "INFO"
log_level = "DEBUG"
filterwarnings = ["ignore:::lark.s*"]
log_format = "%(asctime)s.%(msecs)03d %(levelname)s %(name)s:%(lineno)s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"

[tool.setuptools_scm]
version_scheme = "python-simplified-semver"

[tool.refurb]
python_version = "3.12"

[tool.ty.environment]
python-version = "3.12"

[tool.ty.analysis]
allowed-unresolved-imports = ["pecos.**"]

[tool.typos.files]
extend-exclude = [
  "ruff.toml",
]
